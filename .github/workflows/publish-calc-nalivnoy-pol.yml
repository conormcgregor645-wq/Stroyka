# Автопубликация калькулятора наливного пола (/nalivnoy-pol.html).
#
# 8 ноября 2026 в 09:00 по Москве (06:00 UTC) сливает ветку calc/nalivnoy-pol
# в main. GitHub Pages после этого пересобирает сайт. Если GitHub задержит или
# пропустит первый запуск, повторы идут каждые 30 минут до 10:30 МСК.
# Повторные запуски ничего не делают, если калькулятор уже в main.
#
# Ветка калькулятора сделана поверх ветки статьи про плитку (иначе 8 ноября
# было бы не слить без конфликтов). Поэтому перед слиянием workflow проверяет,
# что статья уже опубликована, — и останавливается, если нет: так калькулятор
# не опубликует статью раньше времени.
#
# Отменить публикацию: Actions → «Публикация калькулятора наливного пола» → «…» →
# Disable workflow, или удалить ветку calc/nalivnoy-pol, или удалить этот файл.
# Опубликовать раньше: Actions → «Публикация калькулятора наливного пола» →
# Run workflow → force = true (статья про плитку должна быть уже в main).
name: Публикация калькулятора наливного пола

on:
  schedule:
    - cron: "0,30 6-7 8 11 *"
  workflow_dispatch:
    inputs:
      force:
        description: "Опубликовать сейчас, не дожидаясь 08.11.2026 09:00 МСК"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-calc-nalivnoy-pol
  cancel-in-progress: false

env:
  CALC_BRANCH: calc/nalivnoy-pol
  PUBLISH_AT: "2026-11-08T06:00:00Z"
  # Последний коммит ветки статьи «Сколько плитки нужно на ванную», на котором основана ветка калькулятора.
  REQUIRED_COMMIT: a6ec3d02c052328bbdf55f3437758774c74d2ce6

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить дату публикации
        id: when
        run: |
          now=$(date -u +%s)
          at=$(date -u -d "$PUBLISH_AT" +%s)
          if [ "${{ inputs.force }}" = "true" ] || [ "$now" -ge "$at" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ещё рано: публикация в $PUBLISH_AT (09:00 МСК). Ничего не делаю."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'true'
        with:
          ref: main
          fetch-depth: 0

      - name: Слить ветку калькулятора в main
        id: merge
        if: steps.when.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin "$CALC_BRANCH" > /dev/null; then
            echo "Ветки $CALC_BRANCH нет — публиковать нечего."
            exit 0
          fi
          git fetch origin "$CALC_BRANCH"
          if git merge-base --is-ancestor "origin/$CALC_BRANCH" HEAD; then
            echo "Калькулятор уже в main."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$REQUIRED_COMMIT" HEAD; then
            echo "::error::Статья про плитку ещё не в main, а ветка калькулятора содержит её. Публикация остановлена, чтобы не выпустить статью раньше времени."
            exit 1
          fi
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git merge --no-ff "origin/$CALC_BRANCH" -m "Публикация калькулятора наливного пола"
          git push origin HEAD:main
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Пересобрать GitHub Pages
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Не удалось запросить сборку Pages — она запустится от пуша в main."

      # Пуш из Actions не запускает workflow IndexNow, поэтому сообщаем Яндексу отсюда.
      # Ошибка здесь не роняет публикацию — только предупреждение.
      - name: Сообщить Яндексу о новых страницах (IndexNow)
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/indexnow.sh "${{ steps.merge.outputs.before }}" HEAD
